name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev,stem,hf]' numpy pytrec-eval-terrier
      - name: Test (metrics cross-checked against trec_eval)
        run: pytest --cov=ragbench --cov-report=term-missing
      - name: README results match results/
        run: python scripts/update_readme.py --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/ragbench --version
          /tmp/venv/bin/ragbench run --data tests/fixtures/tiny \
            --retriever examples/overlap.py:WordOverlap --out /tmp/r.json --quiet

  dense-smoke:
    # Exercises the real fastembed path end to end (downloads a ~67 MB ONNX model).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-bge-small-en-v1.5
      - run: pip install -e '.[dense]'
      - name: Run Dense on the tiny fixture
        env:
          FASTEMBED_CACHE_PATH: /tmp/fastembed_cache
        run: |
          ragbench run --data tests/fixtures/tiny --retriever ragbench.retrievers:Dense \
            --param model=BAAI/bge-small-en-v1.5 --out /tmp/dense.json --quiet
          python -c "import json; d = json.load(open('/tmp/dense.json')); assert d['metrics']['recall@10']['mean'] > 0, d['metrics']"

  gate-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Same retriever as the baseline passes
        id: same
        uses: ./
        with:
          data: tests/fixtures/tiny
          retriever: ragbench.retrievers:BM25
          baseline: tests/fixtures/gate/tiny-bm25.json
          metrics: ndcg@10,recall@10
      - name: A worse retriever fails
        id: worse
        continue-on-error: true
        uses: ./
        with:
          data: tests/fixtures/tiny
          retriever: examples/overlap.py:WordOverlap
          params: |
            min_overlap=2
          baseline: tests/fixtures/gate/tiny-bm25.json
      - name: Check both outcomes
        env:
          SAME: ${{ steps.same.outputs.passed }}
          WORSE: ${{ steps.worse.outputs.passed }}
          WORSE_OUTCOME: ${{ steps.worse.outcome }}
        run: |
          echo "same=$SAME worse=$WORSE worse_outcome=$WORSE_OUTCOME"
          [ "$SAME" = "true" ] && [ "$WORSE" = "false" ] && [ "$WORSE_OUTCOME" = "failure" ]
