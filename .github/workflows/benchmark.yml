name: Benchmark

# Runs scripts/benchmark.sh on BEIR datasets, one job per dataset, and uploads
# results/ as the "benchmark-results" artifact. The result files committed to this
# repository are that artifact, unedited; each one records this workflow's run URL
# and the commit it ran on.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/benchmark.sh"
      - ".github/workflows/benchmark.yml"
      - "src/ragbench/retrievers/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dataset: [scifact, nfcorpus, arguana]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Datasets and model weights only. Corpus embeddings are not cached across
      # runs, so every published run embeds its corpus itself.
      - uses: actions/cache@v4
        with:
          path: |
            data
            /tmp/fastembed_cache
          key: beir-and-models-v3-${{ matrix.dataset }}
      - run: pip install -e '.[dense,stem,hf]'
      - name: Run the benchmark
        env:
          DATASETS: ${{ matrix.dataset }}
          FASTEMBED_CACHE_PATH: /tmp/fastembed_cache
        run: bash scripts/benchmark.sh
      - name: Results table
        run: ragbench report results/*/[!c]*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.dataset }}
          path: results/

  collect:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
      # The same files as a checksummed archive in the log, for anyone who can read
      # this run's logs but can't download its artifacts.
      - name: Print the results archive
        run: |
          tar -czf results.tgz results
          sha256sum results.tgz
          find results -type f | sort | xargs sha256sum
          echo "BEGIN results.tgz base64"
          base64 -w 76 results.tgz
          echo "END results.tgz base64"
