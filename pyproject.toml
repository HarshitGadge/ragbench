[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ragbench"
version = "0.1.0"
description = "Evaluate any retriever on BEIR-format data: nDCG, recall and MRR with bootstrap confidence intervals and paired comparisons."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Harshit Gadge" }]
keywords = ["rag", "retrieval", "evaluation", "beir", "information-retrieval", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
dense = ["fastembed>=0.4", "numpy>=1.26"]
stem = ["snowballstemmer>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ragbench = "ragbench.cli:main"

[project.urls]
Repository = "https://github.com/HarshitGadge/ragbench"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
